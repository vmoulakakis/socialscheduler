name: "➕ New Tracking URL"
description: "Add a new destination/tracking URL and create a unique social campaign with platform-specific copy and an asset."
title: "[TRACKING] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form whenever you want to add a new URL to the Social Media Autopilot.
        The URL is preserved exactly as entered. The pipeline creates a unique internal campaign/execution identity instead of modifying opaque tracking URLs.

  - type: input
    id: tracking_url
    attributes:
      label: Tracking URL
      description: Paste the exact destination / affiliate / tracking URL. It will not be modified.
      placeholder: https://example.com/...
    validations:
      required: true

  - type: dropdown
    id: brand
    attributes:
      label: Brand
      options:
        - CoffeeGo AI
        - CabinPilot Travel
        - CabinPilot Smart Savings
        - Lyseis / Biz Box Solver
        - Travel AI / GreekVibes
        - Red Raven Eyewear
        - Other
    validations:
      required: true

  - type: input
    id: angle
    attributes:
      label: Campaign angle / hook
      description: Short idea for what makes this post useful or interesting.
      placeholder: e.g. Last-minute September escape without the planning stress
    validations:
      required: true

  - type: input
    id: target_at
    attributes:
      label: Target date/time (Europe/Athens)
      description: Use YYYY-MM-DD HH:MM. The pipeline converts it with the real Europe/Athens timezone offset.
      placeholder: 2026-09-20 19:00
    validations:
      required: true

  - type: input
    id: platforms
    attributes:
      label: Platforms
      description: Comma-separated. Allowed values: instagram, facebook, tiktok.
      value: instagram,facebook,tiktok
    validations:
      required: true

  - type: dropdown
    id: asset_mode
    attributes:
      label: Asset mode
      description: auto-card creates a unique branded social card; existing-file reuses an asset already in /assets; manual-review blocks scheduling until an asset is supplied.
      options:
        - auto-card
        - existing-file
        - manual-review
    validations:
      required: true

  - type: input
    id: asset_reference
    attributes:
      label: Existing asset filename (optional)
      description: Required only when Asset mode is existing-file. Use the exact filename already under /assets.
      placeholder: example.png
    validations:
      required: false

  - type: dropdown
    id: claim_sensitivity
    attributes:
      label: Claim sensitivity
      description: Choose current-claim-sensitive for prices, stock, discounts, airline rules, Red Raven product claims, or other facts that need fresh verification.
      options:
        - normal
        - current-claim-sensitive
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / asset attachments
      description: Optional context. You can also drag an image or file into this field for reference.
      placeholder: CTA, audience, offer context, creative notes...
    validations:
      required: false
