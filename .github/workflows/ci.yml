name: CI

on:
  push:
    branches:
      - main
      - feat/socialmarket-outbox-executor
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile src/*.py scripts/*.py tests/*.py
      - name: Validate JSON config
        run: |
          python -m json.tool config/settings.json >/dev/null
          python -m json.tool config/channels.json >/dev/null
          python -m json.tool config/backlog.json >/dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SocialMarket V2 OIDC smoke
        if: github.event_name == 'push'
        env:
          SOCIALMARKET_OUTBOX_URL: "https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/publishing-outbox"
          SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
        run: |
          python - <<'PY'
          import json
          from src.socialmarket_outbox import SocialMarketOutboxClient
          client = SocialMarketOutboxClient.from_env()
          health = client.health()
          jobs = client.peek(3)
          assert health.get('executor_enabled') is False, health
          print(json.dumps({'health': health, 'peek_count': len(jobs)}, indent=2))
          PY
