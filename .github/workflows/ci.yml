name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenPost media dependency
        run: python -m pip install --disable-pip-version-check -r requirements-openpost.txt
      - name: Compile Python
        run: python -m py_compile src/*.py scripts/*.py tests/*.py
      - name: Validate JSON config
        run: |
          python -m json.tool config/settings.json >/dev/null
          python -m json.tool config/channels.json >/dev/null
          python -m json.tool config/backlog.json >/dev/null
      - name: Validate OpenPost self-host compose
        shell: bash
        run: |
          cp deploy/openpost/.env.example deploy/openpost/.env
          docker compose -f deploy/openpost/docker-compose.yml --env-file deploy/openpost/.env config >/dev/null
          rm -f deploy/openpost/.env
      - name: Validate Windows OpenPost PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            'deploy/openpost-windows/install-openpost.ps1',
            'deploy/openpost-windows/uninstall-openpost.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $path" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
