name: Tracking URL Intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tracking-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-campaign:
    if: >-
      startsWith(github.event.issue.title, '[TRACKING]') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Normalize tracking request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          mkdir -p inbox/tracking
          python -m scripts.tracking_intake \
            --issue-number "$ISSUE_NUMBER" \
            --issue-url "$ISSUE_URL" \
            --issue-body "$ISSUE_BODY" \
            --registry config/tracking_sources.json \
            --output "inbox/tracking/issue-${ISSUE_NUMBER}.json"

      - name: Build unique campaign and asset
        id: factory
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          python -m scripts.tracking_content_factory \
            --request "inbox/tracking/issue-${ISSUE_NUMBER}.json" \
            --backlog config/backlog.json \
            --assets assets | tee /tmp/tracking-factory.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('/tmp/tracking-factory.json', encoding='utf-8'))
          print(f"campaign_id={data['campaign_id']}")
          print(f"status={data['status']}")
          print(f"asset_filename={data.get('asset_filename') or ''}")
          PY

      - name: Validate repository
        run: |
          python -m compileall -q src scripts tests
          python -m json.tool config/backlog.json >/dev/null
          python -m json.tool config/tracking_sources.json >/dev/null
          python -m unittest discover -s tests -v

      - name: Persist intake and campaign
        id: persist
        shell: bash
        run: |
          git add config/backlog.json config/tracking_sources.json inbox/tracking assets
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "socialscheduler-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "content: tracking intake #${{ github.event.issue.number }}"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm intake on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CAMPAIGN_ID: ${{ steps.factory.outputs.campaign_id }}
          STATUS: ${{ steps.factory.outputs.status }}
          ASSET: ${{ steps.factory.outputs.asset_filename }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Tracking intake processed ✅

- Campaign ID: \`$CAMPAIGN_ID\`
- State: \`$STATUS\`
- Asset: \`${ASSET:-none}\`
- Tracking URL: preserved exactly as submitted
- Buffer scheduling: still controlled only by the Social Scheduler safety/reconciliation path

Edit this issue to update the same campaign deterministically; it will not create a duplicate campaign ID."
