name: Weekly Multi-Provider Conversion Optimizer

on:
  schedule:
    - cron: "40 6 * * 2"
  workflow_dispatch:

concurrency:
  group: weekly-conversion-optimizer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      POSTZEN_API_KEY: ${{ secrets.POSTZEN_API_KEY }}
      BRIGHTBEAN_API_KEY: ${{ secrets.BRIGHTBEAN_API_KEY }}
      SOCIALMARKET_OUTBOX_URL: "https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/publishing-outbox"
      SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
      PUBLISHER_RUNTIME_CONFIG_URL: "https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/publisher-runtime-config"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optimize from unified provider feedback
        run: python -m scripts.weekly_optimizer
