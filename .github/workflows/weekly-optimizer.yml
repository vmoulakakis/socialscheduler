name: Weekly Buffer Optimizer

on:
  schedule:
    - cron: "40 6 * * 2"
  workflow_dispatch:

concurrency:
  group: weekly-buffer-optimizer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      SOCIALMARKET_OUTBOX_URL: "https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/publishing-outbox"
      SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require Buffer API secret
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
      - name: Pull weekly metrics and optimize
        run: python -m scripts.weekly_optimizer
