name: Buffer Auth Probe

on:
  push:
    paths:
      - ".github/workflows/buffer-auth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Verify secret presence
        shell: bash
        run: |
          test -n "$BUFFER_API_KEY" || { echo "SECRET_MISSING"; exit 10; }
          echo "SECRET_PRESENT"
      - name: Probe Buffer account endpoint once
        shell: bash
        run: |
          set +e
          HTTP_CODE=$(curl --silent --show-error --max-time 25 \
            --output /tmp/buffer-body.json \
            --write-out "%{http_code}" \
            --request POST "https://api.buffer.com" \
            --header "Authorization: Bearer $BUFFER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"query":"query Account { account { id organizations { id name } } }"}')
          CURL_CODE=$?
          set -e
          if [ "$CURL_CODE" -ne 0 ]; then
            echo "BUFFER_PROBE_NETWORK_ERROR curl=$CURL_CODE http=$HTTP_CODE"
            exit 20
          fi
          case "$HTTP_CODE" in
            200)
              python - <<'PY'
import json
with open('/tmp/buffer-body.json', encoding='utf-8') as f:
    body=json.load(f)
if body.get('errors'):
    print('BUFFER_HTTP_200_GRAPHQL_ERROR')
    raise SystemExit(31)
account=(body.get('data') or {}).get('account')
if not account:
    print('BUFFER_HTTP_200_NO_ACCOUNT')
    raise SystemExit(32)
print('BUFFER_AUTH_OK')
print('ORGANIZATIONS_VISIBLE=' + str(len(account.get('organizations') or [])))
PY
              ;;
            401|403)
              echo "BUFFER_AUTH_REJECTED http=$HTTP_CODE"
              exit 40
              ;;
            429)
              echo "BUFFER_RATE_LIMITED http=429"
              exit 42
              ;;
            *)
              echo "BUFFER_UNEXPECTED_HTTP=$HTTP_CODE"
              exit 50
              ;;
          esac
