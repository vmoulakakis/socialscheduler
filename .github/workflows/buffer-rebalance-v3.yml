name: Buffer V3 Queue Rebalance

on:
  push:
    branches: [main]
    paths:
      - ".github/rebalance-buffer-v3-trigger"

concurrency:
  group: buffer-v3-rebalance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete only obsolete far-future site posts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from src.buffer_client import BufferClient

          post_ids = [
              "6a81c38d41cca3f873d17295",
              "6a81c38d3486edd56d1374ee",
              "6a81c38e41cca3f873d172ba",
              "6a81c38ef4405f5c090b2cc4",
              "6a81c38ef4405f5c090b2ce8",
              "6a81c38ea207c7c8593fec4e",
              "6a81c38fa207c7c8593fec72",
          ]
          client = BufferClient.from_env()
          deleted=[]
          for post_id in post_ids:
              deleted.append(client.delete_post(post_id))
          if set(deleted) != set(post_ids):
              raise SystemExit(f"rebalance incomplete: {deleted}")
          print(json.dumps({"ok": True, "deleted": deleted}, indent=2))
          PY
