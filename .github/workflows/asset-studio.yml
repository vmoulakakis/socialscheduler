name: SocialScheduler Zero-Cost Asset Studio

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/trigger-asset-studio'

permissions:
  contents: write

concurrency:
  group: socialscheduler-asset-studio
  cancel-in-progress: false

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rpfadpdnnxequgvdcfoq.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_NkMSCtURWbZcA8MCY1H5sA_W_G10WYD
      ASSET_LIMIT: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free media tooling
        run: pip install 'Pillow>=11,<13' 'qrcode[pil]>=8,<9'

      - name: Generate missing posters + QR assets
        run: python scripts/generate_missing_assets.py

      - name: Commit generated assets
        run: |
          if git status --porcelain -- assets/generated | grep -q .; then
            git config user.name 'SocialScheduler Asset Studio'
            git config user.email 'actions@users.noreply.github.com'
            git add assets/generated
            git commit -m 'Generate SocialScheduler opportunity assets'
            git push
          else
            echo 'No new asset files to commit.'
          fi
