name: Cleanup Premature V3 Site Schedules

on:
  push:
    branches: [main]
    paths:
      - ".github/cleanup-premature-v3-trigger"

concurrency:
  group: cleanup-premature-v3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete premature Site-only posts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from src.buffer_client import BufferClient

          post_ids = [
            "6a81d1a49284fc013d5f61ea",
            "6a81d1a33486edd56d1445f0",
            "6a81d1a341cca3f873d24f8f",
            "6a81d1a3a207c7c85940d004",
            "6a81d1a33486edd56d1445bb",
            "6a81d1a2a207c7c85940cfe0",
            "6a81d1a2f4405f5c090bf7dd",
            "6a81d1a2cb308e1e8d8fd534",
            "6a81d1a2cb308e1e8d8fd510",
          ]
          client = BufferClient.from_env()
          deleted=[]
          for post_id in post_ids:
              deleted.append(client.delete_post(post_id))
          if set(deleted) != set(post_ids):
              raise SystemExit(f"cleanup incomplete: {deleted}")
          print(json.dumps({"ok": True, "deleted": deleted}, indent=2))
          PY
