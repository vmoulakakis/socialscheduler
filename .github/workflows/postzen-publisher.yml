name: PostZen Orchestrated Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PostZen publisher mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  schedule:
    - cron: "27 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/postzen-publisher.yml"

concurrency:
  group: social-scheduler-publisher
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish-postzen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scheduled runs are live. Push-triggered smoke runs are always dry-run.
      SCHEDULER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'schedule' && 'live' || 'dry-run' }}
      POSTZEN_API_URL: "https://api.postzen.dev"
      POSTZEN_API_KEY: ${{ secrets.POSTZEN_API_KEY }}
      SOCIALMARKET_OUTBOX_URL: "https://gqpbskssrvpfjtujwezc.supabase.co/functions/v1/publishing-outbox"
      SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
      OUTBOX_HORIZON_HOURS: "72"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip safely if PostZen is not configured
        id: config
        shell: bash
        run: |
          if [ -z "$POSTZEN_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PostZen is not configured; no jobs will be claimed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute PostZen publisher
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m scripts.reconcile_provider_deliveries --provider postzen | tee artifacts/postzen-reconciliation.json
          python -m src.postzen_main --mode "$SCHEDULER_MODE" | tee artifacts/postzen-result.json

      - name: Add PostZen result to summary
        if: always()
        shell: bash
        run: |
          echo "## PostZen Orchestrated Publisher" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/postzen-result.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/postzen-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No PostZen execution was required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload PostZen audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socialscheduler-postzen-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
