name: Social Scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      content_source:
        description: "Content source"
        required: true
        default: "socialmarket_outbox"
        type: choice
        options:
          - socialmarket_outbox
          - legacy_backlog
      publisher_backend:
        description: "Publishing backend"
        required: true
        default: "buffer"
        type: choice
        options:
          - buffer
          - postiz
          - openpost
  push:
    branches: [main]
    paths:
      - ".github/trigger-buffer"

concurrency:
  group: social-scheduler-publisher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  schedule-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.publisher_backend || vars.PUBLISHER_BACKEND || 'buffer' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: "68a86463018d512de98d6315"
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      POSTIZ_API_URL: ${{ vars.POSTIZ_API_URL || 'https://api.postiz.com/public/v1' }}
      POSTIZ_INTEGRATION_FACEBOOK: ${{ vars.POSTIZ_INTEGRATION_FACEBOOK }}
      POSTIZ_INTEGRATION_INSTAGRAM: ${{ vars.POSTIZ_INTEGRATION_INSTAGRAM }}
      POSTIZ_INTEGRATION_TIKTOK: ${{ vars.POSTIZ_INTEGRATION_TIKTOK }}
      OPENPOST_API_URL: ${{ vars.OPENPOST_API_URL }}
      OPENPOST_API_TOKEN: ${{ secrets.OPENPOST_API_TOKEN }}
      OPENPOST_WORKSPACE_ID: ${{ vars.OPENPOST_WORKSPACE_ID }}
      OPENPOST_ACCOUNT_FACEBOOK: ${{ vars.OPENPOST_ACCOUNT_FACEBOOK }}
      OPENPOST_ACCOUNT_INSTAGRAM: ${{ vars.OPENPOST_ACCOUNT_INSTAGRAM }}
      OPENPOST_ACCOUNT_TIKTOK: ${{ vars.OPENPOST_ACCOUNT_TIKTOK }}
      OPENPOST_MEDIA_MAX_BYTES: ${{ vars.OPENPOST_MEDIA_MAX_BYTES || '104857600' }}
      OPENPOST_MEDIA_READY_TIMEOUT_SECONDS: ${{ vars.OPENPOST_MEDIA_READY_TIMEOUT_SECONDS || '90' }}
      SCHEDULER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      CONTENT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.content_source || 'socialmarket_outbox' }}
      SOCIALMARKET_OUTBOX_URL: "https://rpfadpdnnxequgvdcfoq.supabase.co/functions/v1/publishing-outbox"
      SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
      TRUTH_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Buffer API secret
        if: env.PUBLISHER_BACKEND == 'buffer'
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY GitHub Actions secret is missing."
            exit 1
          fi

      - name: Require Postiz API secret
        if: env.PUBLISHER_BACKEND == 'postiz'
        shell: bash
        run: |
          if [ -z "$POSTIZ_API_KEY" ]; then
            echo "POSTIZ_API_KEY GitHub Actions secret is missing."
            exit 1
          fi

      - name: Require OpenPost configuration
        if: env.PUBLISHER_BACKEND == 'openpost'
        shell: bash
        run: |
          missing=0
          for name in OPENPOST_API_URL OPENPOST_API_TOKEN OPENPOST_WORKSPACE_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is missing."
              missing=1
            fi
          done
          if [ -z "$OPENPOST_ACCOUNT_FACEBOOK$OPENPOST_ACCOUNT_INSTAGRAM$OPENPOST_ACCOUNT_TIKTOK" ]; then
            echo "At least one OPENPOST_ACCOUNT_* mapping is required."
            missing=1
          fi
          exit "$missing"

      - name: Execute rolling SocialMarket publisher
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          case "$PUBLISHER_BACKEND" in
            buffer)
              python -m src.main --mode "$SCHEDULER_MODE" | tee artifacts/scheduler-result.json
              ;;
            postiz)
              python -m src.postiz_main --mode "$SCHEDULER_MODE" | tee artifacts/scheduler-result.json
              ;;
            openpost)
              python -m src.openpost_main --mode "$SCHEDULER_MODE" | tee artifacts/scheduler-result.json
              ;;
            *)
              echo "Unsupported PUBLISHER_BACKEND=$PUBLISHER_BACKEND"
              exit 1
              ;;
          esac

      - name: Build Buffer Full Truth Admin Dashboard
        if: always() && env.PUBLISHER_BACKEND == 'buffer'
        shell: bash
        run: |
          mkdir -p artifacts
          python -m scripts.full_truth_dashboard | tee artifacts/dashboard-build.json
          cat artifacts/admin-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add alternative publisher result to summary
        if: always() && (env.PUBLISHER_BACKEND == 'postiz' || env.PUBLISHER_BACKEND == 'openpost')
        shell: bash
        run: |
          echo "## ${PUBLISHER_BACKEND} Publisher Result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/scheduler-result.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Update persistent Buffer Admin Dashboard
        if: always() && env.PUBLISHER_BACKEND == 'buffer' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          body = Path('artifacts/admin-dashboard.md').read_text(encoding='utf-8')
          Path('artifacts/issue-patch.json').write_text(json.dumps({'body': body}, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/5" --input artifacts/issue-patch.json

      - name: Upload publisher audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socialscheduler-${{ env.PUBLISHER_BACKEND }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
