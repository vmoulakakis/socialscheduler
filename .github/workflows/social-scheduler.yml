name: Social Scheduler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  push:
    branches: [main]
    paths:
      - ".github/trigger-buffer"

concurrency:
  group: social-scheduler-publisher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  schedule-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHER_BACKEND: buffer
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: "68a86463018d512de98d6315"
      SCHEDULER_MODE: ${{ inputs.mode || 'dry-run' }}
      CONTENT_SOURCE: "socialmarket_outbox"
      SOCIALMARKET_OUTBOX_URL: "https://gqpbskssrvpfjtujwezc.supabase.co/functions/v1/publishing-outbox"
      SOCIALMARKET_OIDC_AUDIENCE: "socialmarket-v2-publishing"
      TRUTH_ARTIFACT_DIR: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Buffer API secret
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Execute rolling SocialMarket publisher
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m src.main --mode "$SCHEDULER_MODE" | tee artifacts/scheduler-result.json

      - name: Sync Buffer feedback metrics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          python -m scripts.sync_buffer_metrics | tee artifacts/metrics-sync.json
          cat artifacts/metrics-sync.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build Buffer Full Truth Admin Dashboard
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          python -m scripts.full_truth_dashboard | tee artifacts/dashboard-build.json
          cat artifacts/admin-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update persistent Buffer Admin Dashboard
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          body = Path('artifacts/admin-dashboard.md').read_text(encoding='utf-8')
          Path('artifacts/issue-patch.json').write_text(json.dumps({'body': body}, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/5" --input artifacts/issue-patch.json

      - name: Upload publisher audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socialscheduler-buffer-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
