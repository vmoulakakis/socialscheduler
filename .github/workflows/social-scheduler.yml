name: Social Scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scheduler mode"
        required: true
        default: "live"
        type: choice
        options:
          - live
          - dry-run
  push:
    branches: [main]
    paths:
      - ".github/trigger-buffer"

concurrency:
  group: social-scheduler-buffer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  schedule-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: "68a86463018d512de98d6315"
      ASSET_REPOSITORY: "vmoulakakis/socialscheduler"
      ASSET_REF: "main"
      SCHEDULER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Require Buffer API secret
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY GitHub Actions secret is missing."
            exit 1
          fi
      - name: Buffer preflight and reconciliation snapshot
        id: buffer-preflight
        run: python -m scripts.buffer_smoke
      - name: Rate-limit safe defer
        if: steps.buffer-preflight.outputs.status == 'rate_limited'
        shell: bash
        run: |
          echo "Buffer is rate limited. No Buffer writes will be attempted in this run."
          echo "Retry after: ${{ steps.buffer-preflight.outputs.retry_at_utc }}"
      - name: Recover original media from existing Buffer Ideas
        if: steps.buffer-preflight.outputs.available == 'true'
        run: python -m scripts.sync_idea_assets
      - name: Persist recovered media in repository
        if: steps.buffer-preflight.outputs.available == 'true'
        shell: bash
        run: |
          git add assets
          if ! git diff --cached --quiet; then
            git config user.name "socialscheduler-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore(assets): sync media from Buffer Ideas"
            git push origin HEAD:main
          fi
      - name: Run scheduler
        if: steps.buffer-preflight.outputs.available == 'true'
        run: python -m src.main --mode "$SCHEDULER_MODE"
