name: Buffer Secret Smoke Test

on:
  push:
    paths:
      - ".github/workflows/buffer-secret-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: "68a86463018d512de98d6315"
      ASSET_REPOSITORY: "vmoulakakis/socialscheduler"
      ASSET_REF: "main"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secret is present
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY is missing"
            exit 1
          fi
          echo "BUFFER_API_KEY is present"
      - name: Run read-only Buffer scheduler dry-run
        run: python -m src.main --mode dry-run
